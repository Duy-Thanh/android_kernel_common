export OUTPUT_FORMAT=$(shell ld -r -print-output-format)
export EXEC_FORMAT=$(shell echo $(OUTPUT_FORMAT) | cut -d - -f1)

# No specific reason for choosing this value for KASan shadow memory offset
# except that there should a contiguous memory region of LKL_KASAN_SHADOW_SIZE.
# The value of LKL_KASAN_SHADOW_SIZE is chosen to provide shadow memory for
# every possible address in a 48-bit address space.
export LKL_DEFAULT_KASAN_SHADOW_OFFSET=0x0000200000000000
export LKL_DEFAULT_KASAN_SHADOW_SIZE=0x0000100000000000

ifneq ($(LKL_KASAN),)
ifneq ($(EXEC_FORMAT),elf64)
$(error LKL KASan is currently not supported for $(EXEC_FORMAT))
endif # EXEC_FORMAT
endif # LKL_KASAN