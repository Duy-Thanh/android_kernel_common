%YAML 1.2
---
$id: http://devicetree.org/schemas/cpufreq/qemu,cpufreq-virtual.yaml#
$schema: http://devicetree.org/meta-schemas/core.yamll#

title: Virtual CPUFreq

maintainers:
  - David Dai <davidai@google.com>
  - Saravana Kannan <saravanak@google.com>

description:
  Virtual CPUFreq is a virtualized driver in guest kernels that sends frequency
  selection of its vCPUs as a hint to the host through MMIO regions. Each vCPU
  has independent frequency scaling and its own set of registers for frequency
  control.

properties:
  compatible:
    const: qemu,virtual-cpufreq

  reg:
    maxItems: 1
    description:
      Address and size of region containing frequency controls for each of the
      vCPUs. Regions for each vCPU is placed contiugously and contain
      registers for controlling DVFS(Dynamic Frequency and Voltage)
      characteristics. The size of the region is proportional to total number
      of vCPUs.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    cpus {
      #address-cells = <1>;
      #size-cells = <0>;

      cpu@0 {
        compatible = "arm,armv8";
        device_type = "cpu";
        reg = <0x0>;
        operating-points-v2 = <&opp_table0>;
      };

      cpu@1 {
        compatible = "arm,armv8";
        device_type = "cpu";
        reg = <0x0>;
        operating-points-v2 = <&opp_table1>;
      };
    };

    opp_table0: opp-table-0 {
      compatible = "operating-points-v2";

      opp1098000000 {
        opp-hz = /bits/ 64 <1098000000>;
        opp-level = <1>;
      };

      opp1197000000 {
        opp-hz = /bits/ 64 <1197000000>;
        opp-level = <2>;
      };
    };

    opp_table1: opp-table-1 {
      compatible = "operating-points-v2";

      opp1106000000 {
        opp-hz = /bits/ 64 <1106000000>;
        opp-level = <1>;
      };

      opp1277000000 {
        opp-hz = /bits/ 64 <1277000000>;
        opp-level = <2>;
      };
    };

    soc {
      #address-cells = <1>;
      #size-cells = <1>;

      cpufreq@1040000 {
        compatible = "qemu,virtual-cpufreq";
        reg = <0x1040000 0x10>;
      };
    };
