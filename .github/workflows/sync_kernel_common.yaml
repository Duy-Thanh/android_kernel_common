name: Sync Kernel Forks from Google

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated GitHub repo names to sync (e.g., android_kernel_common,android_kernel_manifest)"
        type: string
        default: "android_kernel_common,android_kernel_manifest"
      upstream_owner:
        description: "Upstream owner on googlesource"
        type: string
        default: "android.googlesource.com"
      upstream_repos:
        description: "Comma-separated upstream paths matching repos order (e.g., kernel/common,kernel/manifest)"
        type: string
        default: "kernel/common,kernel/manifest"
      branch_filter:
        description: "Regex to filter branches to sync (default: GKI branches only)"
        type: string
        default: "^(common-android|android[0-9]+-[0-9]+\\.[0-9]+|main-kernel)"
      tag_filter:
        description: "Regex to filter tags to sync (default: android GKI tags)"
        type: string
        default: "^android[0-9]+-[0-9]+\\.[0-9]+-[0-9]{4}-[0-9]{2}(_r[0-9]+)?$"
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3am UTC

permissions:
  contents: write

jobs:
  sync:
    name: Sync repos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Parse repo lists
        id: parse
        run: |
          REPOS="${{ github.event.inputs.repos || 'android_kernel_common,android_kernel_manifest' }}"
          UPSTREAM_REPOS="${{ github.event.inputs.upstream_repos || 'kernel/common,kernel/manifest' }}"
          BRANCH_FILTER="${{ github.event.inputs.branch_filter || '^(common-android|android[0-9]+-[0-9]+\\.[0-9]+|main-kernel)' }}"
          TAG_FILTER="${{ github.event.inputs.tag_filter || '^android[0-9]+-[0-9]+\\.[0-9]+-[0-9]{4}-[0-9]{2}(_r[0-9]+)?$' }}"
          echo "repos=$(echo "$REPOS" | sed 's/,/ /g')" >> "$GITHUB_OUTPUT"
          echo "upstream_repos=$(echo "$UPSTREAM_REPOS" | sed 's/,/ /g')" >> "$GITHUB_OUTPUT"
          echo "branch_filter=$BRANCH_FILTER" >> "$GITHUB_OUTPUT"
          echo "tag_filter=$TAG_FILTER" >> "$GITHUB_OUTPUT"

      - name: Sync each repo
        env:
          BRANCH_FILTER: ${{ steps.parse.outputs.branch_filter }}
          TAG_FILTER: ${{ steps.parse.outputs.tag_filter }}
        run: |
          REPOS=(${{ steps.parse.outputs.repos }})
          UPSTREAM_REPOS=(${{ steps.parse.outputs.upstream_repos }})
          
          for i in "${!REPOS[@]}"; do
            REPO="${REPOS[i]}"
            UPSTREAM_REPO="${UPSTREAM_REPOS[i]}"
            
            echo "=== Syncing $REPO -> $UPSTREAM_REPO ==="
            cd /tmp
            rm -rf "sync_$REPO"
            # Shallow clone fork first (fast)
            git clone --bare --depth=1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/$REPO.git" "sync_$REPO"
            cd "sync_$REPO"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            UPSTREAM="https://${{ github.event.inputs.upstream_owner }}/$UPSTREAM_REPO"
            git remote add upstream "$UPSTREAM"
            
            # 1. List matching branches from upstream (fast, no download)
            echo "Finding matching branches..."
            BRANCHES=$(git ls-remote --heads upstream | awk '{print $2}' | sed 's|refs/heads/||' | grep -E "$BRANCH_FILTER" || true)
            
            if [ -n "$BRANCHES" ]; then
              echo "Branches to fetch:"
              echo "$BRANCHES"
              # Fetch only matching branches
              for BR in $BRANCHES; do
                echo "Fetching branch: $BR"
                git fetch upstream "refs/heads/$BR:refs/remotes/upstream/$BR" --depth=100
              done
              # Push to fork
              for BR in $BRANCHES; do
                git push origin "refs/remotes/upstream/$BR:refs/heads/$BR" --force
              done
            else
              echo "No matching branches"
            fi
            
            # 2. List matching tags from upstream
            echo "Finding matching tags..."
            TAGS=$(git ls-remote --tags upstream | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}$' | grep -E "$TAG_FILTER" || true)
            
            if [ -n "$TAGS" ]; then
              echo "Tags to fetch:"
              echo "$TAGS"
              for TG in $TAGS; do
                echo "Fetching tag: $TG"
                git fetch upstream "refs/tags/$TG:refs/tags/$TG"
              done
              # Push to fork
              for TG in $TAGS; do
                git push origin "refs/tags/$TG:refs/tags/$TG" --force
              done
            else
              echo "No matching tags"
            fi
            
            # Prune deleted refs
            git push origin --prune
            
            echo "=== $REPO synced ==="
            git branch -r | head -10
            git tag -l | sort -V | tail -5
            echo ""
          done
            fi
            
            # Filter tags
            echo "Filtering tags with: $TAG_FILTER"
            TAGS_TO_PUSH=$(git tag -l | grep -E "$TAG_FILTER" || true)
            if [ -z "$TAGS_TO_PUSH" ]; then
              echo "No matching tags found"
            else
              echo "Tags to push:"
              echo "$TAGS_TO_PUSH"
              for TG in $TAGS_TO_PUSH; do
                git push origin "refs/tags/$TG:refs/tags/$TG" --force
              done
            fi
            
            git push origin --prune
            
            echo "=== $REPO synced ==="
            git branch -r | head -10
            git tag -l | sort -V | tail -5
            echo ""
          done
