name: Sync Kernel Forks from Google

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated GitHub repo names to sync"
        type: string
        default: "android_kernel_common,android_kernel_manifest"
      upstream_owner:
        description: "Upstream host"
        type: string
        default: "android.googlesource.com"
      upstream_repos:
        description: "Comma-separated upstream paths, same order as repos"
        type: string
        default: "kernel/common,kernel/manifest"
      branch_filter:
        description: "Regex to filter branches (default: GKI branches only)"
        type: string
        default: '^(common-android|android[0-9]+-[0-9]+\.[0-9]+|main-kernel)'
      tag_filter:
        description: "Regex to filter tags (default: android GKI tags)"
        type: string
        default: '^android[0-9]+-[0-9]+\.[0-9]+-[0-9]{4}-[0-9]{2}(_r[0-9]+)?$'
      specific_branches:
        description: "Specific branches (comma-separated). If empty, uses branch_filter."
        type: string
        default: ""
      specific_tags:
        description: "Specific tags (comma-separated). If empty, uses tag_filter."
        type: string
        default: ""
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3am UTC

permissions:
  contents: write

concurrency:
  group: sync-kernel-forks
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          REPOS: ${{ inputs.repos || 'android_kernel_common,android_kernel_manifest' }}
          UPSTREAM_REPOS: ${{ inputs.upstream_repos || 'kernel/common,kernel/manifest' }}
        run: |
          IFS=',' read -ra R <<< "$REPOS"
          IFS=',' read -ra U <<< "$UPSTREAM_REPOS"
          if [ "${#R[@]}" -ne "${#U[@]}" ]; then
            echo "repos and upstream_repos must have the same number of items" >&2
            exit 1
          fi
          json='[]'
          for i in "${!R[@]}"; do
            json=$(jq -c --arg r "${R[i]// /}" --arg u "${U[i]// /}" '. + [{repo:$r, upstream:$u}]' <<< "$json")
          done
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync ${{ matrix.repo }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350   # max for GitHub-hosted runners is 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      REPO: ${{ matrix.repo }}
      UPSTREAM_REPO: ${{ matrix.upstream }}
      UPSTREAM_HOST: ${{ inputs.upstream_owner || 'android.googlesource.com' }}
      BRANCH_FILTER: ${{ inputs.branch_filter || '^(common-android|android[0-9]+-[0-9]+\.[0-9]+|main-kernel)' }}
      TAG_FILTER: ${{ inputs.tag_filter || '^android[0-9]+-[0-9]+\.[0-9]+-[0-9]{4}-[0-9]{2}(_r[0-9]+)?$' }}
      SPECIFIC_BRANCHES: ${{ inputs.specific_branches }}
      SPECIFIC_TAGS: ${{ inputs.specific_tags }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Init bare repo (no full clone of the fork)
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/sync.git"
          cd "$RUNNER_TEMP/sync.git"
          git config http.postBuffer 524288000
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 120
          git config gc.auto 0
          git remote add upstream "https://${UPSTREAM_HOST}/${UPSTREAM_REPO}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git"

      - name: Resolve refs to sync
        working-directory: ${{ runner.temp }}/sync.git
        run: |
          set -euo pipefail
          git ls-remote upstream 'refs/heads/*' 'refs/tags/*' > all_refs.txt

          if [ -n "$SPECIFIC_BRANCHES" ]; then
            echo "$SPECIFIC_BRANCHES" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' > branches.txt
          else
            awk '{print $2}' all_refs.txt | grep '^refs/heads/' | sed 's|refs/heads/||' \
              | { grep -E "$BRANCH_FILTER" || true; } > branches.txt
          fi

          if [ -n "$SPECIFIC_TAGS" ]; then
            echo "$SPECIFIC_TAGS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' > tags.txt
          else
            awk '{print $2}' all_refs.txt | grep '^refs/tags/' | grep -v '\^{}$' | sed 's|refs/tags/||' \
              | { grep -E "$TAG_FILTER" || true; } > tags.txt
          fi

          # refspecs: fetch straight into local refs/heads + refs/tags
          { sed 's|.*|+refs/heads/&:refs/heads/&|' branches.txt
            sed 's|.*|+refs/tags/&:refs/tags/&|' tags.txt; } > refspecs.txt

          echo "Branches: $(wc -l < branches.txt)  Tags: $(wc -l < tags.txt)"
          [ -s refspecs.txt ] || { echo "Nothing matched, nothing to sync"; exit 0; }

      - name: Fetch from upstream (single fetch)
        working-directory: ${{ runner.temp }}/sync.git
        timeout-minutes: 150
        run: |
          set -euo pipefail
          [ -s refspecs.txt ] || exit 0
          for attempt in 1 2 3; do
            if git fetch upstream --no-tags --no-write-fetch-head --stdin < refspecs.txt; then
              exit 0
            fi
            echo "fetch failed (attempt $attempt), retrying..."; sleep 30
          done
          exit 1

      - name: Push to fork (batched)
        working-directory: ${{ runner.temp }}/sync.git
        timeout-minutes: 180
        run: |
          set -uo pipefail
          [ -s refspecs.txt ] || exit 0
          fail=0
          # Push branches first, then tags, in small batches
          for kind in branches tags; do
            [ -s "$kind.txt" ] || continue
            if [ "$kind" = branches ]; then prefix=heads; else prefix=tags; fi
            split -l 20 "$kind.txt" "batch_${kind}_"
            for f in batch_${kind}_*; do
              args=$(sed "s|.*|+refs/${prefix}/&:refs/${prefix}/&|" "$f" | tr '\n' ' ')
              ok=0
              for attempt in 1 2 3; do
                # shellcheck disable=SC2086
                if git push origin $args; then ok=1; break; fi
                echo "push failed ($f, attempt $attempt), retrying..."; sleep 20
              done
              [ "$ok" = 1 ] || { echo "::warning::Failed to push batch $f"; fail=1; }
            done
          done
          [ "$fail" = 0 ] || exit 1

      - name: Summary
        if: always()
        working-directory: ${{ runner.temp }}/sync.git
        run: |
          echo "=== $REPO synced ==="
          git for-each-ref --sort=-creatordate --count=5 refs/heads
          git tag -l | sort -V | tail -5
