name: Sync Kernel Forks from Google

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated GitHub repo names to sync (e.g., android_kernel_common,android_kernel_manifest)"
        type: string
        default: "android_kernel_common,android_kernel_manifest"
      upstream_owner:
        description: "Upstream owner on googlesource"
        type: string
        default: "android.googlesource.com"
      upstream_repos:
        description: "Comma-separated upstream paths matching repos order (e.g., kernel/common,kernel/manifest)"
        type: string
        default: "kernel/common,kernel/manifest"
      branch_filter:
        description: "Regex to filter branches to sync (default: GKI branches only)"
        type: string
        default: "^(common-android|android[0-9]+-[0-9]+\\.[0-9]+|main-kernel)"
      tag_filter:
        description: "Regex to filter tags to sync (default: android GKI tags)"
        type: string
        default: "^android[0-9]+-[0-9]+\\.[0-9]+-[0-9]{4}-[0-9]{2}(_r[0-9]+)?$"
      specific_branches:
        description: "Specific branches to sync (comma-separated). If empty, uses branch_filter."
        type: string
        default: ""
      specific_tags:
        description: "Specific tags to sync (comma-separated). If empty, uses tag_filter."
        type: string
        default: ""
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3am UTC

permissions:
  contents: write

jobs:
  sync:
    name: Sync repos
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Parse repo lists
        id: parse
        run: |
          REPOS="${{ github.event.inputs.repos || 'android_kernel_common,android_kernel_manifest' }}"
          UPSTREAM_REPOS="${{ github.event.inputs.upstream_repos || 'kernel/common,kernel/manifest' }}"
          BRANCH_FILTER="${{ github.event.inputs.branch_filter || '^(common-android|android[0-9]+-[0-9]+\\.[0-9]+|main-kernel)' }}"
          TAG_FILTER="${{ github.event.inputs.tag_filter || '^android[0-9]+-[0-9]+\\.[0-9]+-[0-9]{4}-[0-9]{2}(_r[0-9]+)?$' }}"
          SPECIFIC_BRANCHES="${{ github.event.inputs.specific_branches }}"
          SPECIFIC_TAGS="${{ github.event.inputs.specific_tags }}"
          echo "repos=$(echo "$REPOS" | sed 's/,/ /g')" >> "$GITHUB_OUTPUT"
          echo "upstream_repos=$(echo "$UPSTREAM_REPOS" | sed 's/,/ /g')" >> "$GITHUB_OUTPUT"
          echo "branch_filter=$BRANCH_FILTER" >> "$GITHUB_OUTPUT"
          echo "tag_filter=$TAG_FILTER" >> "$GITHUB_OUTPUT"
          echo "specific_branches=$SPECIFIC_BRANCHES" >> "$GITHUB_OUTPUT"
          echo "specific_tags=$SPECIFIC_TAGS" >> "$GITHUB_OUTPUT"

      - name: Sync each repo
        env:
          BRANCH_FILTER: ${{ steps.parse.outputs.branch_filter }}
          TAG_FILTER: ${{ steps.parse.outputs.tag_filter }}
          SPECIFIC_BRANCHES: ${{ steps.parse.outputs.specific_branches }}
          SPECIFIC_TAGS: ${{ steps.parse.outputs.specific_tags }}
        run: |
          REPOS=(${{ steps.parse.outputs.repos }})
          UPSTREAM_REPOS=(${{ steps.parse.outputs.upstream_repos }})
          
          for i in "${!REPOS[@]}"; do
            REPO="${REPOS[i]}"
            UPSTREAM_REPO="${UPSTREAM_REPOS[i]}"
            
            echo "=== Syncing $REPO -> $UPSTREAM_REPO ==="
            cd /tmp
            rm -rf "sync_$REPO"
            git clone --bare "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/$REPO.git" "sync_$REPO"
            cd "sync_$REPO"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            UPSTREAM="https://${{ github.event.inputs.upstream_owner }}/$UPSTREAM_REPO"
            git remote add upstream "$UPSTREAM"
            
            # Determine branches to sync
            if [ -n "$SPECIFIC_BRANCHES" ]; then
              # Use specific branches
              BRANCHES=$(echo "$SPECIFIC_BRANCHES" | sed 's/,/ /g')
              echo "Using specific branches: $BRANCHES"
            else
              # Use filter
              echo "Finding matching branches with filter: $BRANCH_FILTER"
              BRANCHES=$(git ls-remote --heads upstream | awk '{print $2}' | sed 's|refs/heads/||' | grep -E "$BRANCH_FILTER" || true)
              if [ -z "$BRANCHES" ]; then
                echo "Warning: No branches matched filter"
              fi
            fi
            
            # Fetch and push branches
            if [ -n "$BRANCHES" ]; then
              echo "Branches to sync:"
              echo "$BRANCHES"
              for BR in $BRANCHES; do
                echo "Fetching branch: $BR"
                git fetch upstream --no-tags "refs/heads/$BR:refs/remotes/upstream/$BR" || echo "Warning: Failed to fetch $BR"
              done
              for BR in $BRANCHES; do
                git push origin "refs/remotes/upstream/$BR:refs/heads/$BR" --force || echo "Warning: Failed to push $BR"
              done
            else
              echo "No branches to sync"
            fi
            
            # Determine tags to sync
            if [ -n "$SPECIFIC_TAGS" ]; then
              TAGS=$(echo "$SPECIFIC_TAGS" | sed 's/,/ /g')
              echo "Using specific tags: $TAGS"
            else
              echo "Finding matching tags with filter: $TAG_FILTER"
              TAGS=$(git ls-remote --tags upstream | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}$' | grep -E "$TAG_FILTER" || true)
              if [ -z "$TAGS" ]; then
                echo "Warning: No tags matched filter"
              fi
            fi
            
            # Fetch and push tags
            if [ -n "$TAGS" ]; then
              echo "Tags to sync:"
              echo "$TAGS"
              for TG in $TAGS; do
                echo "Fetching tag: $TG"
                git fetch upstream "refs/tags/$TG:refs/tags/$TG" || echo "Warning: Failed to fetch $TG"
              done
              for TG in $TAGS; do
                git push origin "refs/tags/$TG:refs/tags/$TG" --force || echo "Warning: Failed to push $TG"
              done
            else
              echo "No tags to sync"
            fi
            
            # Prune deleted refs
            git push origin --prune
            
            echo "=== $REPO synced ==="
            git branch -r | head -10
            git tag -l | sort -V | tail -5
            echo ""
          done
