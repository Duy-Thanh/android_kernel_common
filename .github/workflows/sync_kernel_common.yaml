name: Sync Kernel Forks from Google

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated repos to sync (e.g., kernel/common,kernel/manifest)"
        type: string
        default: "kernel/common,kernel/manifest"
      upstream_owner:
        description: "Upstream owner on googlesource"
        type: string
        default: "android.googlesource.com"
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3am UTC

permissions:
  contents: write

jobs:
  sync:
    name: Sync repos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Parse repo list
        id: parse
        run: |
          REPOS="${{ github.event.inputs.repos || 'kernel/common,kernel/manifest' }}"
          echo "repos=$(echo "$REPOS" | sed 's/,/ /g')" >> "$GITHUB_OUTPUT"

      - name: Sync each repo
        run: |
          for REPO in ${{ steps.parse.outputs.repos }}; do
            echo "=== Syncing $REPO ==="
            cd /tmp
            rm -rf "sync_$REPO"
            git clone --bare "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/$REPO.git" "sync_$REPO"
            cd "sync_$REPO"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            UPSTREAM="https://${{ github.event.inputs.upstream_owner }}/$REPO"
            git remote add upstream "$UPSTREAM"
            git fetch upstream --prune --tags --force
            
            git push origin "refs/remotes/upstream/*:refs/heads/*" --force
            git push origin "refs/tags/*:refs/tags/*" --force
            git push origin --prune
            
            echo "=== $REPO synced ==="
            git branch -r | head -10
            git tag -l | sort -V | tail -5
            echo ""
          done
